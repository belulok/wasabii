<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasabi — sign in</title>
<style>
:root{--bg:#0f1114;--panel:#171a1f;--line:#272c34;--fg:#e8eaed;--mut:#8d949f;
  --acc:#8ec63f;--bad:#e0655f;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:24px;
  font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:372px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:28px 26px 24px}
h1{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 6px;
  font-size:22px;font-weight:600;letter-spacing:.1em;text-transform:lowercase}
h1 svg{width:26px;height:26px;color:var(--acc)}
.sub{text-align:center;color:var(--mut);font-size:12.5px;margin:0 0 22px}
button,input{font:inherit;width:100%;border-radius:9px;border:1px solid var(--line)}
input{background:#13161a;color:var(--fg);padding:11px 12px;font-size:13.5px;margin-bottom:9px}
input:focus{outline:none;border-color:var(--acc)}
button{cursor:pointer;padding:11px 12px;font-size:13.5px;font-weight:600}
.g{background:#fff;color:#1f1f1f;border-color:#fff;display:flex;align-items:center;
  justify-content:center;gap:9px}
.g:hover{background:#f1f1f1}
.pri{background:var(--acc);color:#0f1410;border-color:var(--acc)}
.ghost{background:none;color:var(--mut);border:0;font-size:12.5px;padding:8px 0;font-weight:400}
.ghost:hover{color:var(--fg)}
.div{display:flex;align-items:center;gap:11px;color:#5d646e;font-size:11px;margin:16px 0;
  letter-spacing:.12em;text-transform:uppercase}
.div:before,.div:after{content:'';flex:1;height:1px;background:var(--line)}
.err{background:rgba(224,101,95,.12);color:var(--bad);border-radius:8px;padding:9px 11px;
  font-size:12.5px;margin-bottom:12px}
.note{color:#6b727c;font-size:11.5px;line-height:1.55;margin-top:16px;text-align:center}
.hidden{display:none}
</style>
<div class="card">
  <h1><svg viewBox="0 0 32 32" aria-hidden="true">
    <path d="M6 23c2.6-8.5 6-12.8 10-12.8S23.4 14.5 26 23z" fill="none"
          stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M16 10.2V5.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  </svg><span>wasabi</span></h1>
  <p class="sub" id="sub">Sign in to continue</p>
  <div id="err" class="err hidden"></div>

  <button class="g" id="google">
    <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 7l7.6 5.9c4.4-4.1 6.7-10.1 6.7-17.4z"/>
      <path fill="#FBBC05" d="M10.5 28.6a14.5 14.5 0 0 1 0-9.2l-7.9-6.2a24 24 0 0 0 0 21.6l7.9-6.2z"/>
      <path fill="#34A853" d="M24 48c6.2 0 11.5-2.1 15.4-5.6l-7.6-5.9c-2.1 1.4-4.8 2.2-7.8 2.2-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/>
    </svg>Continue with Google</button>

  <div class="div">or email</div>

  <form id="form" autocomplete="on">
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password (10+ characters)"
           autocomplete="current-password" minlength="10" required>
    <button class="pri" id="go" type="submit">Sign in</button>
  </form>
  <button class="ghost" id="toggle">Need an account? Create one</button>

  <div class="note" id="note">Your key never reaches this server. Transactions are
    signed in your browser; the server only relays the signed bytes, from ~19ms
    away from the sequencer.</div>
</div>
<script>
const $=i=>document.getElementById(i);
let mode='login';
const err=m=>{const e=$('err');e.textContent=m;e.classList.toggle('hidden',!m)};

fetch('/auth/me').then(r=>r.json()).then(d=>{
  if(!d.google) $('google').style.display='none';
  if(d.open){
    $('sub').textContent='Create an account';
    $('toggle').textContent='Already have an account? Sign in';
  }
  if(d.claimable){
    mode='signup';
    $('sub').textContent='Create the owner account';
    $('go').textContent='Create account';
    $('password').autocomplete='new-password';
    $('toggle').style.display='none';
    $('note').textContent='No account exists yet, so the first one created becomes the owner. '+
      'Set WASABI_ALLOWED_EMAILS afterwards to control who else may join.';
  }
}).catch(()=>{});

$('toggle').onclick=()=>{
  mode = mode==='login' ? 'signup' : 'login';
  $('sub').textContent = mode==='login' ? 'Sign in to continue' : 'Create an account';
  $('go').textContent  = mode==='login' ? 'Sign in' : 'Create account';
  $('password').autocomplete = mode==='login' ? 'current-password' : 'new-password';
  $('toggle').textContent = mode==='login'
    ? 'Need an account? Create one' : 'Already have an account? Sign in';
  err('');
};
$('google').onclick=()=>{location.href='/auth/google/start'};
$('form').onsubmit=async e=>{
  e.preventDefault(); err(''); $('go').disabled=true;
  try{
    const r=await fetch('/auth/'+mode,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:$('email').value,password:$('password').value})});
    const d=await r.json();
    if(!r.ok){err(d.error||'sign in failed');$('go').disabled=false;return}
    location.href='/';
  }catch(ex){err(String(ex));$('go').disabled=false}
};
</script>
